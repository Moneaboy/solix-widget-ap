name: APK bauen

on:
  workflow_dispatch:
  push:
    paths:
      - "generate_project.py"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Gradle holen
        run: |
          curl -sSL -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Projekt erzeugen
        run: python3 generate_project.py

      - name: Umgebung protokollieren
        run: |
          java -version 2>&1 | head -1
          gradle --version | grep -m1 Gradle
          echo "SDK: ${ANDROID_HOME:-nicht gesetzt}"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "keine Plattformen"

      - name: APK bauen
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Fehler zusammenfassen
        if: failure()
        run: |
          {
            echo "## Build fehlgeschlagen"
            echo
            echo "### Compilerfehler"
            echo '```'
            grep -E "^e: " /tmp/build.log | head -30 || echo "keine"
            echo '```'
            echo "### Gradle-Ursache"
            echo '```'
            grep -A 12 "What went wrong" /tmp/build.log | head -40 || echo "keine"
            echo '```'
            echo "### Letzte Ausgaben"
            echo '```'
            tail -40 /tmp/build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Protokoll sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log

      - name: APK benennen
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk \
             "out/solix-widget-${{ github.run_number }}.apk"
          ls -la out

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Solix Widget Build ${{ github.run_number }}
          body: |
            Automatisch gebaut aus Commit ${{ github.sha }}.
            APK unten antippen, um sie direkt auf dem Handy zu installieren.
          files: out/*.apk
